<!DOCTYPE html>
<html>
  <head>
    <script defer src="main.js"></script>
    <link rel="stylesheet" href="style.css"></link>
  </head>
  <body>
    <header>
      <a href="https://github.com/MillivoltLightningbolt/top-calculator" title="github (source code)">
        <img class="github-logo" src="assets/github_logo.svg" alt="Github logo linking to source code"/>
      </a>
    </header>
    <div class="calculator">
      <div class="background">
        <div class="display">
        </div>
        <div class="keypad">
          <div class="row">
            <button class="digit">7</button>
            <button class="digit">8</button>
            <button class="digit">9</button>
            <button class="operator">/</button>
          </div>
          <div class="row">
            <button class="digit">4</button>
            <button class="digit">5</button>
            <button class="digit">6</button>
            <button class="operator">*</button>
          </div>
          <div class="row">
            <button class="digit">1</button>
            <button class="digit">2</button>
            <button class="digit">3</button>
            <button class="operator">-</button>
          </div>
          <div class="row zero">
            <button class="clear-entry">DEL</button>
            <button class="digit">0</button>
            <button class="decimal">.</button>
            <button class="operator double-height">+</button>
          </div>
          <div class="row equals">
            <button class="clear-all">C</button>
            <button class="equals double-width">=</button>
          </div>
        </div>
      </div>
    </div>
    <footer>
      <a href="http://www.styleseven.com/">Display font: DIGITAL-7 version 1.11 by Sizenko Alexander</a>
    </footer>
  </body>
</html>
